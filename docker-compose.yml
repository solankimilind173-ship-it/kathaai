services:
  app:
    build: .
    image: kathaai-app
    container_name: kathaai-app
    restart: unless-stopped
    volumes:
      - public_assets:/public_assets
      - storage_data:/var/www/html/storage
      - env_data:/var/www/html/env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-kathaai}
      - DB_USERNAME=${DB_USERNAME:-kathaai}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kathaai

  nginx:
    build:
      context: docker/nginx
      dockerfile: Dockerfile
    image: kathaai-nginx
    container_name: kathaai-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - public_assets:/var/www/html:ro
    depends_on:
      - app
    networks:
      - kathaai

  mysql:
    image: mysql:8.0
    container_name: kathaai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kathaai}
      MYSQL_USER: ${DB_USERNAME:-kathaai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kathaai

  # Optional: run queue worker (uncomment if using queues)
  # queue:
  #   build: .
  #   image: kathaai-app
  #   container_name: kathaai-queue
  #   restart: unless-stopped
  #   command: php artisan queue:work --tries=3 --sleep=3
  #   volumes:
  #     - .:/var/www/html
  #   environment:
  #     - APP_ENV=production
  #     - DB_CONNECTION=mysql
  #     - DB_HOST=mysql
  #     - DB_DATABASE=${DB_DATABASE:-kathaai}
  #     - DB_USERNAME=${DB_USERNAME:-kathaai}
  #     - DB_PASSWORD=${DB_PASSWORD:-secret}
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - kathaai

  # Optional: Redis (uncomment and set CACHE_STORE=redis, SESSION_DRIVER=redis, QUEUE_CONNECTION=redis on app)
  # redis:
  #   image: redis:alpine
  #   container_name: kathaai-redis
  #   restart: unless-stopped
  #   networks:
  #     - kathaai

volumes:
  mysql_data:
  public_assets:
  storage_data:
  env_data:

networks:
  kathaai:
    driver: bridge
